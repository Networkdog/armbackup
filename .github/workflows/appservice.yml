name: Validate and deploy App Service
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: armbackup-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m ruff check src tests scripts webjob
      - run: python -m mypy src
      - run: node --test tests/*.test.mjs
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Package application without local state or credentials
        env:
          ARMBACKUP_DEPLOY_CONFIG: ${{ vars.ARMBACKUP_DEPLOY_CONFIG }}
        run: python scripts/package_appservice.py --output deploy.zip
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy immutable source package
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: deploy.zip
      - name: Check health and authentication boundary
        env:
          APP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          EXPECTED_BUILD: ${{ github.sha }}
        run: |
          export APP_HOST="$(az webapp show --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" --query defaultHostName -o tsv)"
          SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
          for policy in scm ftp; do
            allow="$(az rest --method get --url "https://management.azure.com/subscriptions/$SUBSCRIPTION_ID/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.Web/sites/$APP_NAME/basicPublishingCredentialsPolicies/$policy?api-version=2023-12-01" --query properties.allow -o tsv)"
            test "$allow" = "false" || { echo "::error::$policy basic authentication must remain disabled"; exit 1; }
          done
          python - <<'PY'
          import os, time, urllib.error, urllib.request, json
          base = 'https://' + os.environ['APP_HOST']
          # The deploy step returns before the new container replaces the old one, so wait for the
          # revision that was just deployed; otherwise the checks below would probe the old container.
          expected = os.environ['EXPECTED_BUILD'].lower()[:12]
          for attempt in range(90):
              try:
                  with urllib.request.urlopen(base + '/health', timeout=20) as response:
                      data = json.load(response)
                  if (data.get('mode') == 'live-lab' and data.get('status') == 'ok'
                          and data.get('azureConnected') is True and data.get('build') == expected):
                      break
              except (urllib.error.URLError, TimeoutError):
                  pass
              time.sleep(10)
          else:
              raise RuntimeError(f'Hosted health never reported the deployed build {expected}')
          from concurrent.futures import ThreadPoolExecutor
          def probe(_):
              try:
                  with urllib.request.urlopen(base + '/health', timeout=30) as response:
                      return response.status
              except urllib.error.HTTPError as error:
                  return error.code
          # A page load fires ~12 module requests at once. The auth proxy reuses upstream connections,
          # so a server that closes sockets after each response shows up as sporadic empty HTTP 500s.
          for _ in range(5):
              with ThreadPoolExecutor(max_workers=12) as pool:
                  statuses = list(pool.map(probe, range(12)))
              if statuses != [200] * 12:
                  raise RuntimeError(f'Concurrent request burst failed: {statuses}')
              time.sleep(0.3)
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None
          try:
              urllib.request.build_opener(NoRedirect).open(base + '/api/session', timeout=20)
          except urllib.error.HTTPError as error:
              if error.code not in (302, 401, 403):
                  raise
          else:
              raise RuntimeError('Unauthenticated API unexpectedly accessible')
          PY
