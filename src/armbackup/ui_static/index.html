<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Azure 관리 평면 형상 백업 콘솔의 로컬 디자인 프리뷰. 예시 데이터만 사용합니다.">
  <title>백업 현황 · armbackup</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.mjs"></script>
</head>
<body>

  <div class="shell">
    <aside class="sidebar" id="sidebar" aria-label="주 메뉴">
      <a class="brand" href="#status" title="백업 현황으로 이동">
        <span class="brand-mark"><svg class="icon"><use href="#i-layers"/></svg></span>
        <span class="brand-text side-label"><span class="brand-name">armbackup</span><span class="brand-caption">CONFIGURATION VAULT</span></span>
      </a>
      <div class="nav-caption">WORKSPACE</div>
      <nav class="navigation">
        <a href="#settings" data-page="settings"><svg class="icon"><use href="#i-sliders"/></svg><span class="side-label">백업 대상</span></a>
        <a href="#status" data-page="status" class="active" aria-current="page"><svg class="icon"><use href="#i-grid"/></svg><span class="side-label">백업 현황</span><span class="nav-count" id="nav-count">—</span></a>
        <a href="#restore" data-page="restore"><svg class="icon"><use href="#i-restore"/></svg><span class="side-label">복원·복제</span></a>
        <a href="#logs" data-page="logs"><svg class="icon"><use href="#i-logs"/></svg><span class="side-label">로그</span></a>
        <a href="#admin" data-page="admin" class="live-only"><svg class="icon"><use href="#i-shield"/></svg><span class="side-label">관리</span></a>
      </nav>
      <div class="sidebar-bottom">
        <button class="sidebar-reset" id="reset-demo"><svg class="icon"><use href="#i-refresh"/></svg><span class="side-label">예시 데이터 초기화</span></button>
        <div class="sidebar-user"><span class="avatar">P</span><span class="side-label">프리뷰 사용자<small>로컬 브라우저 · 예시 모드</small></span><span class="user-dot"></span></div>
        <button class="sidebar-toggle" id="sidebar-toggle" type="button" aria-controls="sidebar" aria-expanded="true" aria-label="메뉴 접기"><svg class="icon"><use href="#i-collapse"/></svg><span class="side-label">메뉴 접기</span></button>
      </div>
    </aside>
    <div class="main-shell">
      <header class="topbar">
        <div class="breadcrumbs"><button id="menu-toggle" class="icon-button mobile-only" aria-label="메뉴 열기" aria-controls="sidebar" aria-expanded="false"><svg class="icon"><use href="#i-menu"/></svg></button><span>워크스페이스</span><svg class="icon"><use href="#i-chevron"/></svg><strong id="breadcrumb-current">백업 현황</strong></div>
        <div id="topbar-slot" class="topbar-slot"></div>
        <div class="topbar-actions"><span class="environment-pill">LOCAL PREVIEW</span><button class="icon-button notification-bell" id="notification-bell" aria-label="알림 목록 열기" aria-controls="notification-panel" aria-expanded="false"><svg class="icon"><use href="#i-bell"/></svg><span id="notification-count" class="notification-count" hidden>0</span></button><button class="icon-button" id="preview-guide" aria-label="프리뷰 안내"><svg class="icon"><use href="#i-help"/></svg></button></div>
      </header>
      <section id="notification-panel" class="notification-panel" aria-label="알림 목록" hidden>
        <div class="notification-panel-head"><strong>알림</strong><button class="button small" id="notification-clear" type="button">모두 지우기</button></div>
        <ul id="notification-list" class="notification-list"></ul>
      </section>
      <main id="main" tabindex="-1"><div class="initial-loading" role="status"><span class="spinner" aria-hidden="true"></span><span class="sr-only">불러오는 중</span></div></main>
    </div>
  </div>
  <dialog id="app-dialog" aria-labelledby="dialog-title">
    <div class="dialog-heading"><h2 id="dialog-title"></h2><button class="icon-button" id="dialog-close" aria-label="닫기"><svg class="icon"><use href="#i-close"/></svg></button></div>
    <div id="dialog-body"></div>
    <div class="dialog-actions" id="dialog-actions"></div>
  </dialog>
  <div id="notification-region" class="notification-region" popover="manual" aria-live="polite"></div>
  <noscript><div class="noscript-warning">이 디자인 프리뷰를 사용하려면 JavaScript를 허용해 주세요.</div></noscript>
</body>
</html>
